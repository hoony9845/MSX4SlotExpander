# OpenOCD config: program the XC9536XL through an FT232H (MPSSE JTAG).
# Wiring (FT232H -> expander J3):
#   AD0/D0 -> J3-3 TCK    AD1/D1 -> J3-5 TDI    AD2/D2 <- J3-4 TDO
#   AD3/D3 -> J3-6 TMS    GND    -> J3-2 GND    (J3-1 = board +3V3, leave open)
# Usage (from CPLD_v2/, after ./build.sh and SVF export):
#   openocd -f ft232h.cfg -c "init; svf build/EXT_SLT_BUF.svf; shutdown"
# Syntax is for OpenOCD 0.10 (Ubuntu 20.04 apt); newer versions accept it with deprecation warnings.

interface ftdi
ftdi_vid_pid 0x0403 0x6014
# data: TMS high; direction: TCK, TDI, TMS outputs
ftdi_layout_init 0x0008 0x000b
adapter_khz 1000
transport select jtag

jtag newtap xc9536xl tap -irlen 8 -expected-id 0x09602093 -ignore-version
